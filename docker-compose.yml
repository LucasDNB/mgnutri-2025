services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mgnutri-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:-MgNutri_Local_2025!}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - mgnutri-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:-MgNutri_Local_2025!}
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('mgnutri') IS NULL CREATE DATABASE mgnutri\""]
    restart: "no"

volumes:
  mgnutri-sql-data:
